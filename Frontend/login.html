<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Drink_Go</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="login" data-auth="guest-user">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3h10v2h-1v5.4a5.5 5.5 0 0 1-3.4 5.08V19h3v2H8.4v-2h3v-3.52A5.5 5.5 0 0 1 8 10.4V5H7V3Zm3 2v5.4a3.5 3.5 0 1 0 7 0V5h-7Z" /></svg>
          </span>
          <span class="brand-title">Drink_Go</span>
        </div>
        <button class="button button-primary full-width auth-google" type="button" data-login-google>
          Entrar com Google
        </button>
      </section>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
