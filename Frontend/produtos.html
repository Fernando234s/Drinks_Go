<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drink_Go | Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="admin-nav">
    <a href="produtos.html" class="brand">Drink_Go</a>
    <div class="nav-links">
      <a href="produtos.html" class="active">Produtos</a>
      <a href="carrinho.html">Carrinho</a>
      <a href="pedidos.html">Pedidos</a>
    </div>
  </nav>

  <main class="admin-page">
    <section class="admin-panel">
      <div class="admin-header">
        <h1>Cadastro de bebidas</h1>
        <button id="refresh-products" class="button secondary" type="button">Atualizar</button>
      </div>

      <form id="product-form" class="admin-form">
        <input id="product-id" type="hidden">
        <input id="product-name" name="nome" type="text" placeholder="Nome" required>
        <input id="product-category" name="categoria" type="text" placeholder="Categoria">
        <input id="product-price" name="preco" type="number" min="0" step="0.01" placeholder="Preco" required>
        <input id="product-stock" name="estoque" type="number" min="0" step="1" placeholder="Estoque" required>
        <button id="save-product" class="button primary" type="submit">Salvar</button>
        <button id="cancel-product" class="button secondary" type="button">Limpar</button>
      </form>

      <button id="add-product-toggle" class="button secondary admin-add-button" type="button">Adicionar bebida</button>
      <div id="products-grid" class="admin-list"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
