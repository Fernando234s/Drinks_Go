<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drink_Go</title>
    <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
  <body data-page="cliente" data-auth="user">
    <header class="topbar">
      <div class="container topbar-content">
        <a class="brand" href="index.html" aria-label="Drink_Go">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3h10v2h-1v5.4a5.5 5.5 0 0 1-3.4 5.08V19h3v2H8.4v-2h3v-3.52A5.5 5.5 0 0 1 8 10.4V5H7V3Zm3 2v5.4a3.5 3.5 0 1 0 7 0V5h-7Z" /></svg>
          </span>
          <span class="brand-title">Drink_Go</span>
        </a>

        <div class="topbar-right">
          <nav class="menu" aria-label="Navegacao principal">
            <a class="nav-link active" href="index.html">Produtos</a>
          </nav>

          <div class="user-chip">
            <span data-user-name>Usuario</span>
            <button class="button button-ghost" type="button" data-logout-user>Sair</button>
          </div>

          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
            <span>Dark</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container page-shell">
      <section class="app-layout">
        <section class="catalog-shell">
          <div class="section-header">
            <h1 class="section-heading">Produtos</h1>
            <span class="pill-label" id="catalogo-count">0 itens</span>
          </div>

          <div id="feedback-produtos" class="feedback hidden"></div>
          <section id="lista-produtos" class="products-grid"></section>
        </section>

        <aside class="cart-panel">
          <section class="cart-card">
            <div class="cart-headline">
              <h2 class="section-heading">Carrinho</h2>
              <span class="cart-badge-strong" id="resumo-itens">0 itens</span>
            </div>

            <div class="summary-grid">
              <article class="summary-box"><span>Itens</span><strong id="resumo-itens-total">0</strong></article>
              <article class="summary-box"><span>Categorias</span><strong id="resumo-tipos">0</strong></article>
            </div>

            <div id="feedback-carrinho" class="feedback hidden"></div>
            <div id="lista-carrinho" class="cart-items"></div>

            <form id="form-cliente" class="client-form" novalidate>
              <label class="field-label" for="cliente-nome">Nome</label>
              <input type="text" id="cliente-nome" placeholder="Nome" />

              <label class="field-label" for="cliente-telefone">Telefone</label>
              <input type="text" id="cliente-telefone" placeholder="Telefone" />

              <label class="field-label" for="cliente-endereco">Endereco</label>
              <input type="text" id="cliente-endereco" placeholder="Endereco" />

              <button class="button button-soft full-width" type="submit">Salvar cliente</button>
            </form>

            <div>
              <label class="field-label" for="cliente-select">Clientes salvos</label>
              <select id="cliente-select">
                <option value="">Cliente salvo</option>
              </select>
            </div>

            <div class="checkout-total">
              <span>Total</span>
              <strong id="valor-total">R$ 0,00</strong>
            </div>

            <button id="finalizar-pedido" class="button button-primary full-width" type="button">Finalizar pedido</button>
          </section>
        </aside>
      </section>
    </main>

    <div class="modal" id="modal-confirmacao-pedido" aria-hidden="true">
      <div class="modal-card">
        <h2 class="modal-title">Pedido</h2>
        <p class="modal-text" id="modal-pedido-texto">Pedido enviado</p>
        <div class="modal-summary" id="modal-pedido-resumo"></div>
        <div class="modal-actions">
          <button class="button button-ghost" type="button" data-modal-close>Fechar</button>
        </div>
      </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
